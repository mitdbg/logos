site_name: LOGos

repo_url: https://github.com/mitdbg/logos
repo_name: mitdbg/logos

theme:
  name: material
  language: en

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy

  icon:
    repo: fontawesome/brands/github

  palette: 

    # Palette toggle for light mode
    - scheme: default
      primary: light-blue
      accent: amber
      toggle:
        icon: material/weather-night 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: light-blue
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode


plugins:
- search
- gen-files:
      scripts:
        - docs/gen_ref_pages.py
- literate-nav:
    nav_file: docs/SUMMARY.md
- section-index
- mkdocstrings:
    handlers:
      python:
        setup_commands:
            - import sys
            - sys.path.append("src")
        paths: [src]
        options:
            docstring_style: google
            docstring_options:
              show_if_no_docstring: true
            show_source: true
            members_order: "source"
            filters: [".*"]
            show_type_annotations: true

nav:
  - Home: index.md
  - Core:
    - "Logos": reference/logos/logos.md
    - "LLM": reference/logos/llm.md
    - "Exceptions": reference/logos/exceptions.md
  - Parsing:
    - "Parser": reference/logos/parsing/parser.md
    - "Drain": reference/logos/parsing/drain.md
    - "Tag Utilities": reference/logos/parsing/tag_utils.md
    - "ParsedVariableName": reference/logos/parsing/parsed_variable_name.md
    - "ParsedSource": reference/logos/parsing/parser_like.md
    - "ParsedDataFrameSource": reference/logos/parsing/parser_from_precomputed.md
  - Preparation:
    - "Preparer": reference/logos/preparation/preparer.md
    - "Aggregate Selector": reference/logos/preparation/aggregate_selector.md
    - "Aggregators": reference/logos/preparation/aggregators.md
    - "Imputators": reference/logos/preparation/imputators.md
    - "Causal Unit Suggester": reference/logos/preparation/causal_unit_suggester.md
    - "PreparedVariableName": reference/logos/preparation/prepared_variable_name.md
    - "PreparedSource": reference/logos/preparation/preparer_like.md
    - "PreparedDataFrameSource": reference/logos/preparation/preparer_from_precomputed.md
  - Exploration:
    - "Explorer": reference/logos/exploration/explorer.md
    - "ATE Calculator": reference/logos/exploration/ate_calculator.md
    - "Candidate Cause Ranker": reference/logos/exploration/candidate_cause_ranker.md
    - "Edge State Matrix": reference/logos/exploration/edge_state_matrix.md
    - "Graph Refiner": reference/logos/exploration/interactive_causal_graph_refiner.md
    - "Graph Renderer": reference/logos/exploration/graph_renderer.md
    - "Pruner": reference/logos/exploration/pruner.md
    - "Regression": reference/logos/exploration/regression.md
    - "Types": reference/logos/exploration/types.md
  - Filesystem:
    - "Cache": reference/logos/filesystem/cache.md
    - "Paths": reference/logos/filesystem/paths.md
    - "Session": reference/logos/filesystem/session.md
  - TUI:
    - "App": reference/logos_tui/app.md
    - "WelcomeScreen": reference/logos_tui/welcome.md
    - "FileSelectScreen": reference/logos_tui/file_select.md
    - "ParseScreen": reference/logos_tui/parse.md
    - "TransformScreen": reference/logos_tui/transform.md
    - "ExploreScreen": reference/logos_tui/explore.md
    - "LoadSessionModal": reference/logos_tui/load_modal.md
    - "SaveSessionModal": reference/logos_tui/save_modal.md
    - "SaveSessionModal": reference/logos_tui/save_modal.md

  
markdown_extensions:
    - markdown_include.include:
        base_path: .
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - tables

